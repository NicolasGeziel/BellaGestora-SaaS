services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: bellagestora_db
    restart: always
    environment:
      POSTGRES_DB: bellagestora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Back-end Spring Boot
  backend:
    build: ./backend
    container_name: bellagestora_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/bellagestora
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db

  # Front-end Angular
  frontend:
    build: ./frontend
    container_name: bellagestora_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: